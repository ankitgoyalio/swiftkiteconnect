name: Protocol tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: protocol-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  ubuntu:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@v3
        with:
          swift-version: '6.4.0'
      - name: Record compiler and OS
        run: |
          swift --version
          cat /etc/os-release
      - name: Ubuntu qualification (protocol, examples and real transports)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .test-results
          bash Scripts/test-ubuntu.sh 2>&1 | tee .test-results/ubuntu.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ubuntu-test-results
          path: .test-results/
          include-hidden-files: true
          if-no-files-found: ignore
  apple:
    runs-on: xcode-27
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
      # The image's iOS 27.1 iPhone Duo runtime failed test-runner startup.
      IOS_SIMULATOR_RUNTIME: com.apple.CoreSimulator.SimRuntime.iOS-27-0
      IOS_SIMULATOR_NAME: iPhone 17
    steps:
      - uses: actions/checkout@v4
      - name: Verify native Xcode and Swift toolchain
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          compiler_version=$(xcrun swift --version 2>&1)
          echo "$compiler_version"
          [[ "$compiler_version" == *"Swift version 6.4"* ]]
          xcrun swift package dump-package > /dev/null
      - name: Documentation integrity and offline Publisher examples
        run: |
          python3 Scripts/audit-snapshot.py
          python3 Scripts/check-documentation-examples.py
          node --test Documentation/Publisher.test.cjs
      - name: macOS public protocol and real loopback HTTP tests
        timeout-minutes: 15
        run: swift test
      - name: iOS Simulator public protocol and real loopback HTTP tests
        timeout-minutes: 25
        run: bash Scripts/test-ios.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-test-results
          path: .test-results/
          include-hidden-files: true
          if-no-files-found: ignore
