name: Protocol tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ubuntu:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@v3
        with:
          swift-version: '6.4.0'
      - name: Record compiler and OS
        run: |
          swift --version
          cat /etc/os-release
      - name: Ubuntu qualification (protocol, examples and real transports)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .test-results
          bash Scripts/test-ubuntu.sh 2>&1 | tee .test-results/ubuntu.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ubuntu-test-results
          path: .test-results/
          include-hidden-files: true
          if-no-files-found: ignore
  apple:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Install Swift 6.4
        uses: swift-actions/setup-swift@v3
        with:
          swift-version: '6.4.0'
      - name: Select Swift toolchain for Xcode and SwiftPM
        shell: bash
        run: |
          set -euo pipefail
          # Swiftly's PATH entry is a launcher, not the compiler bundle.
          # Use its installed location so xcodebuild selects the same toolchain.
          toolchain_id=$(python3 - <<'PY'
          import pathlib, plistlib, subprocess
          bundle = pathlib.Path(subprocess.check_output(
              ["swiftly", "use", "--print-location"], text=True).strip())
          metadata = bundle / "Info.plist"
          if not metadata.exists():
              metadata = bundle / "ToolchainInfo.plist"
          with metadata.open("rb") as source:
              values = plistlib.load(source)
          print(values.get("CFBundleIdentifier") or values["Identifier"])
          PY
          )
          echo "TOOLCHAINS=$toolchain_id" >> "$GITHUB_ENV"
          compiler_version=$(xcrun --toolchain "$toolchain_id" swift --version 2>&1)
          echo "$compiler_version"
          [[ "$compiler_version" == *"Swift version 6.4"* ]]
      - name: Record compiler and Xcode
        run: |
          swift --version
          xcodebuild -version
      - name: Documentation integrity and offline Publisher examples
        run: |
          python3 Scripts/audit-snapshot.py
          python3 Scripts/check-documentation-examples.py
          node --test Documentation/Publisher.test.cjs
      - name: macOS public protocol and real loopback HTTP tests
        run: swift test
      - name: iOS Simulator public protocol and real loopback HTTP tests
        run: bash Scripts/test-ios.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-test-results
          path: .test-results/
          include-hidden-files: true
          if-no-files-found: ignore
