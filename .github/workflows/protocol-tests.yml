name: Protocol tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      package_cache:
        description: 'Download cache experiment (off until hosted benefit is measured)'
        type: choice
        default: 'off'
        options: ['off', 'cold', 'warm', 'invalid']
      compilation_cache:
        description: 'Minimum macOS compilation pilot (requires package_cache; default off)'
        type: choice
        default: 'off'
        options: ['off', 'cold', 'warm', 'invalid', 'compare']
concurrency:
  group: protocol-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  ubuntu:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Check preinstalled Swift 6.4
        id: swift
        shell: bash
        run: |
          set -euo pipefail
          if command -v swift >/dev/null && swift --version | grep -Eq 'Swift version 6\.4([. ]|$)'; then
            echo 'installed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'installed=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Import official Swift signing keys for installer
        if: steps.swift.outputs.installed != 'true'
        shell: bash
        run: |
          set -euo pipefail
          curl --compressed --fail --silent --show-error --location --retry 3 \
            https://www.swift.org/keys/all-keys.asc -o "$RUNNER_TEMP/swift-signing-keys.asc"
          gpg --batch --import "$RUNNER_TEMP/swift-signing-keys.asc"
      - uses: swift-actions/setup-swift@v3
        if: steps.swift.outputs.installed != 'true'
        with:
          swift-version: '6.4.0'
      - name: Record compiler and OS
        run: |
          swift --version
          cat /etc/os-release
      - if: github.event_name == 'workflow_dispatch' && inputs.package_cache != 'off'
        uses: ./.github/actions/package-downloads
        with:
          kind: swift
          mode: ${{ inputs.package_cache }}
      - name: Ubuntu qualification (protocol, examples and real transports)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .test-results
          bash Scripts/test-ubuntu.sh 2>&1 | tee .test-results/ubuntu.txt
      # External availability is reported separately from deterministic qualification.
      - name: Public sandbox SDK smoke (nonblocking)
        id: sandbox
        continue-on-error: true
        timeout-minutes: 2
        env:
          KITE_SANDBOX_INSTRUMENT_SMOKE: '1'
        shell: bash
        run: |
          set -euo pipefail
          swift test --skip-build --filter instrumentsPublicSandboxSmoke 2>&1 | tee .test-results/sandbox-public.txt
      - name: Report public sandbox outcome
        if: always()
        env:
          SANDBOX_OUTCOME: ${{ steps.sandbox.outcome }}
        run: |
          echo "Public sandbox SDK smoke: $SANDBOX_OUTCOME (external availability; nonblocking)." >> "$GITHUB_STEP_SUMMARY"
          echo 'No authenticated API or trading qualification is implied. See issue #27.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ubuntu-test-results
          path: .test-results/
          include-hidden-files: true
          if-no-files-found: ignore
  apple-platform:
    runs-on: xcode-27
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
      # The image's iOS 27.1 iPhone Duo runtime failed test-runner startup.
      IOS_SIMULATOR_RUNTIME: com.apple.CoreSimulator.SimRuntime.iOS-27-0
      IOS_SIMULATOR_NAME: iPhone 17
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install pinned SwiftFormat
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/swiftformat"
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/nicklockwood/SwiftFormat/releases/download/0.64.3/swiftformat.zip \
            -o "$RUNNER_TEMP/swiftformat.zip"
          unzip -q "$RUNNER_TEMP/swiftformat.zip" -d "$RUNNER_TEMP/swiftformat"
          echo "$RUNNER_TEMP/swiftformat" >> "$GITHUB_PATH"
      - name: Enforce authored changes with commit checks
        shell: bash
        env:
          CHECK_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          python3 Scripts/check-development.py
          swiftformat . --lint --config .swiftformat
          base="${CHECK_BASE:-HEAD^}"
          python3 .githooks/pre-commit --base "$base"
      - name: Verify native Xcode and Swift toolchain
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          compiler_version=$(xcrun swift --version 2>&1)
          echo "$compiler_version"
          [[ "$compiler_version" == *"Swift version 6.4"* ]]
          xcrun swift package dump-package > /dev/null
      - if: github.event_name == 'workflow_dispatch' && inputs.package_cache != 'off'
        uses: ./.github/actions/package-downloads
        with:
          kind: swift
          mode: ${{ inputs.package_cache }}
      - if: github.event_name == 'workflow_dispatch' && inputs.package_cache != 'off'
        uses: ./.github/actions/package-downloads
        with:
          kind: xcode
          mode: ${{ inputs.package_cache }}
      - name: Build macOS tests
        timeout-minutes: 15
        run: swift build --build-tests
      - name: macOS public protocol and real loopback HTTP tests
        timeout-minutes: 3
        run: python3 Scripts/test-macos.py
      - name: Constrained-executor HTTP regression
        timeout-minutes: 3
        run: env LIBDISPATCH_COOPERATIVE_POOL_STRICT=1 swift test --skip-build --filter 'real (local )?HTTP' --maximum-repetitions 10
      - name: iOS Simulator public protocol and real loopback HTTP tests
        timeout-minutes: 25
        run: bash Scripts/test-ios.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ios-test-results
          path: .test-results/
          include-hidden-files: true
          if-no-files-found: ignore
  docc:
    runs-on: xcode-27
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install pinned SwiftFormat
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/swiftformat"
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/nicklockwood/SwiftFormat/releases/download/0.64.3/swiftformat.zip \
            -o "$RUNNER_TEMP/swiftformat.zip"
          unzip -q "$RUNNER_TEMP/swiftformat.zip" -d "$RUNNER_TEMP/swiftformat"
          echo "$RUNNER_TEMP/swiftformat" >> "$GITHUB_PATH"
      - name: Verify native Xcode and Swift toolchain
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          compiler_version=$(xcrun swift --version 2>&1)
          echo "$compiler_version"
          [[ "$compiler_version" == *"Swift version 6.4"* ]]
          xcrun swift package dump-package > /dev/null
      - if: github.event_name == 'workflow_dispatch' && inputs.package_cache != 'off'
        uses: ./.github/actions/package-downloads
        with:
          kind: swift
          mode: ${{ inputs.package_cache }}
      - name: Documentation integrity and offline Publisher examples
        run: |
          python3 Scripts/check-documentation.py
          python3 -m unittest discover -s Tests/Hooks -p 'test_*.py'
          python3 Scripts/audit-snapshot.py
          python3 Scripts/check-documentation-examples.py
          node --test Tests/Publisher.test.cjs
      - name: Build and validate static DocC documentation
        run: |
          python3 -m unittest discover -s Tests/Documentation -p 'test_*.py'
          python3 Scripts/build-documentation.py
      - uses: actions/upload-artifact@v7
        with:
          name: docc-site
          # DocC symbol filenames include colons, which upload-artifact rejects.
          path: .build/documentation/docc-validation.tar
          include-hidden-files: true
          if-no-files-found: error
      - name: Package root-hosted Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: .build/documentation/site
      - name: Retain DocC package download experiment evidence
        if: always() && github.event_name == 'workflow_dispatch' && inputs.package_cache != 'off'
        uses: actions/upload-artifact@v7
        with:
          name: docc-package-cache-results
          path: .test-results/package-cache/
          include-hidden-files: true
          if-no-files-found: ignore
  apple:
    needs: [apple-platform, docc]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Require Apple platform and documentation validation
        shell: bash
        env:
          PLATFORM_RESULT: ${{ needs.apple-platform.result }}
          DOCC_RESULT: ${{ needs.docc.result }}
        run: |
          set -euo pipefail
          [[ "$PLATFORM_RESULT" == success && "$DOCC_RESULT" == success ]]
  minimum-macos:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/minimum-macos-environment
      - if: github.event_name == 'workflow_dispatch' && inputs.package_cache != 'off'
        uses: ./.github/actions/package-downloads
        with:
          kind: swift
          mode: ${{ inputs.package_cache }}
      - if: github.event_name == 'workflow_dispatch' && inputs.compilation_cache != 'off'
        id: compilation
        uses: ./.github/actions/compilation-cache
        with:
          mode: ${{ inputs.compilation_cache }}
          downloads: ${{ inputs.package_cache }}
      - name: Build macOS 15 tests
        timeout-minutes: 15
        shell: bash
        env:
          COMPILATION_MODE: ${{ inputs.compilation_cache }}
          MATCHED_COMPILATION: ${{ steps.compilation.outputs.matched }}
        run: |
          set -euo pipefail
          if [[ "$COMPILATION_MODE" != off && -n "$COMPILATION_MODE" ]]; then
            args=()
            if [[ -n "$MATCHED_COMPILATION" ]]; then args+=(--restored); fi
            python3 Scripts/ci-compilation-cache.py build "${args[@]}" 2>&1 | tee .test-results/minimum-macos-build.txt
          else
            swift build --build-tests 2>&1 | tee .test-results/minimum-macos-build.txt
          fi
      - name: macOS 15 public protocol and real transport tests
        timeout-minutes: 3
        shell: bash
        run: |
          set -euo pipefail
          python3 Scripts/test-macos.py 2>&1 | tee .test-results/minimum-macos-tests.txt
      - name: macOS 15 constrained-executor HTTP regression
        timeout-minutes: 3
        shell: bash
        run: |
          set -euo pipefail
          env LIBDISPATCH_COOPERATIVE_POOL_STRICT=1 swift test --skip-build --filter 'real (local )?HTTP' --maximum-repetitions 10 2>&1 | tee .test-results/minimum-macos-constrained.txt
      - name: Compare edited candidate against clean compilation
        if: github.event_name == 'workflow_dispatch' && inputs.compilation_cache == 'compare'
        timeout-minutes: 20
        run: python3 Scripts/ci-compilation-cache.py compare
      - name: Record compilation storage before transfer
        if: github.event_name == 'workflow_dispatch' && inputs.compilation_cache != 'off'
        run: du -sk .build | tee .test-results/compilation-cache/storage-kib.txt
      - name: Save qualified compilation products
        if: github.event_name == 'workflow_dispatch' && inputs.compilation_cache != 'off'
        uses: actions/cache/save@v5
        with:
          path: |
            .build/*/debug
            .build/build.db
            .build/debug.yaml
          key: ${{ steps.compilation.outputs.key }}-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: minimum-macos-test-results
          path: .test-results/
          include-hidden-files: true
          if-no-files-found: error
  ios18-runtime:
    runs-on: macos-15
    timeout-minutes: 35
    outputs:
      artifact-id: ${{ steps.runtime-upload.outputs.artifact-id }}
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7
      - name: Record runtime export environment
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .test-results
          {
            git rev-parse HEAD
            sw_vers
            uname -m
            xcodebuild -version
            xcrun simctl list runtimes
            df -h /
          } 2>&1 | tee .test-results/ios18-runtime-environment.txt
      # Xcode 16's embedded package resolver cannot load tools-version 6.4.
      # Export its older runtime for the Xcode 27 iOS qualification job instead.
      - name: Export iOS 18.5 runtime
        timeout-minutes: 15
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -downloadPlatform iOS -buildVersion 18.5 -exportPath "$RUNNER_TEMP/ios18-runtime" 2>&1 | tee .test-results/ios18-runtime-export.txt
          xcrun simctl list runtimes --json > .test-results/ios18-runtime-export-inventory.json
          python3 Scripts/runtime-artifact.py create "$RUNNER_TEMP/ios18-runtime" .test-results/ios18-runtime-export-inventory.json | tee .test-results/ios18-runtime-manifest.json
      - uses: actions/upload-artifact@v7
        id: runtime-upload
        timeout-minutes: 10
        with:
          name: ios18-runtime
          path: |
            ${{ runner.temp }}/ios18-runtime/*.dmg
            ${{ runner.temp }}/ios18-runtime/manifest.json
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
      - name: Clean up runtime export and record storage
        if: always()
        timeout-minutes: 2
        shell: bash
        run: |
          mkdir -p .test-results
          rm -f "$RUNNER_TEMP"/ios18-runtime/*.dmg
          df -h / 2>&1 | tee .test-results/ios18-runtime-storage.txt
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ios18-runtime-results
          path: .test-results/
          include-hidden-files: true
          if-no-files-found: error
  minimum-ios:
    needs: ios18-runtime
    runs-on: xcode-27
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
      IOS_SIMULATOR_RUNTIME: com.apple.CoreSimulator.SimRuntime.iOS-18-5
      IOS_SIMULATOR_NAME: iPhone 16
    steps:
      - uses: actions/checkout@v7
      - name: Free space for iOS 18 runtime
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .test-results
          {
            df -h /
            # This fresh hosted runner only tests iOS 18.5. Remove its unused
            # preinstalled images before downloading and staging the older one.
            xcrun simctl runtime delete all
            df -h /
          } 2>&1 | tee .test-results/minimum-ios-storage.txt
      # artifact-ids selects the immutable upload from this run; no cross-run token.
      - uses: actions/download-artifact@v8
        timeout-minutes: 10
        with:
          artifact-ids: ${{ needs.ios18-runtime.outputs.artifact-id }}
          merge-multiple: true
          path: ${{ runner.temp }}/ios18-runtime
      - name: Verify runtime artifact provenance and checksum
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          cp "$RUNNER_TEMP/ios18-runtime/manifest.json" .test-results/ios18-runtime-manifest.json
          python3 Scripts/runtime-artifact.py verify "$RUNNER_TEMP/ios18-runtime" .test-results/unused.json 2>&1 | tee .test-results/ios18-runtime-verification.txt
      - name: Import iOS 18.5 runtime
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .test-results
          for image in "$RUNNER_TEMP"/ios18-runtime/*.dmg; do
            xcodebuild -importPlatform "$image" 2>&1 | tee -a .test-results/ios18-runtime-import.txt
          done
          rm -f "$RUNNER_TEMP"/ios18-runtime/*.dmg
          xcrun simctl create 'iPhone 16' com.apple.CoreSimulator.SimDeviceType.iPhone-16 "$IOS_SIMULATOR_RUNTIME"
      - name: Verify iOS qualification environment
        shell: bash
        run: |
          set -euo pipefail
          {
            git rev-parse HEAD
            sw_vers
            uname -m
            xcodebuild -version
            xcrun swift --version
            xcrun simctl list runtimes
            xcrun simctl list devices available
          } 2>&1 | tee .test-results/minimum-ios-environment.txt
          xcrun swift --version | grep -Eq 'Swift version 6\.4([. ]|$)'
          xcrun simctl list runtimes --json > .test-results/ios18-runtime-import-inventory.json
          python3 Scripts/runtime-artifact.py verify-installed "$RUNNER_TEMP/ios18-runtime" .test-results/ios18-runtime-import-inventory.json 2>&1 | tee .test-results/ios18-runtime-installed-verification.txt
      - if: github.event_name == 'workflow_dispatch' && inputs.package_cache != 'off'
        uses: ./.github/actions/package-downloads
        with:
          kind: xcode
          mode: ${{ inputs.package_cache }}
      - name: iOS 18 public protocol and real transport tests
        timeout-minutes: 25
        shell: bash
        run: |
          set -euo pipefail
          bash Scripts/test-ios.sh 2>&1 | tee .test-results/minimum-ios-tests.txt
      - name: Clean up runtime import and record diagnostics
        if: always()
        timeout-minutes: 2
        shell: bash
        run: |
          mkdir -p .test-results
          rm -f "$RUNNER_TEMP"/ios18-runtime/*.dmg
          {
            df -h /
            xcrun simctl list runtimes
            xcrun simctl runtime list
          } 2>&1 | tee .test-results/minimum-ios-final-diagnostics.txt
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: minimum-ios-test-results
          path: .test-results/
          include-hidden-files: true
          if-no-files-found: error
  minimum-apple:
    needs: [minimum-macos, minimum-ios]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Require both minimum OS suites
        shell: bash
        env:
          MACOS_RESULT: ${{ needs.minimum-macos.result }}
          IOS_RESULT: ${{ needs.minimum-ios.result }}
        run: |
          set -euo pipefail
          [[ "$MACOS_RESULT" == success && "$IOS_RESULT" == success ]]
  deploy:
    # Default success() also prevents publication after cancellation/failure.
    needs: [apple, ubuntu, minimum-apple]
    if: >-
      ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' &&
          needs.apple.result == 'success' && needs.ubuntu.result == 'success' &&
          needs.minimum-apple.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - name: Publish the verified development documentation
        id: deployment
        uses: actions/deploy-pages@v5
