name: CI timing
on:
  workflow_run:
    workflows: [Protocol tests]
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: Protocol tests run ID to measure
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  timing:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # workflow_run may describe a fork. Execute only trusted default-branch
      # collector code, never its checkout, scripts or downloaded artifacts.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Collect completed qualification metadata
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id || inputs.run_id }}
        run: python3 Scripts/ci-timing.py --run-id "$RUN_ID" --output .test-results/ci-timing/current
      - name: Publish compact timing summary
        run: cat .test-results/ci-timing/current/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ci-timing-${{ github.event.workflow_run.id || inputs.run_id }}
          path: .test-results/ci-timing/current/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
