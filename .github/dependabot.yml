version: 2
updates:
  - package-ecosystem: swift
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: Asia/Kolkata
    open-pull-requests-limit: 2
    commit-message:
      prefix: "chore(deps)"
    groups:
      # Match package identities and repository-qualified dependency names.
      networking:
        patterns:
          - "*swift-nio*"
          - "*websocket-kit*"
        update-types:
          - minor
          - patch
    # swift-crypto and major upgrades remain individual reviewable PRs.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: Asia/Kolkata
    open-pull-requests-limit: 1
    commit-message:
      prefix: "ci(deps)"
    groups:
      actions:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
