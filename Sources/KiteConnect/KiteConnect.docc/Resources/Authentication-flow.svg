<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400" role="img" aria-labelledby="title description">
  <title id="title">Application-owned authentication</title>
  <desc id="description">The application presents Kite login. Its backend exchanges the request token. The client uses the access token to fetch a user profile.</desc>
  <rect width="720" height="400" rx="20" fill="#f1f5f9"/>
  <g font-family="system-ui, sans-serif" text-anchor="middle">
    <text x="360" y="42" font-size="23" fill="#0f172a">Authenticate, then read a profile</text>
    <g fill="#ffffff" stroke="#64748b" stroke-width="2">
      <rect x="60" y="80" width="250" height="95" rx="12"/>
      <rect x="410" y="80" width="250" height="95" rx="12"/>
      <rect x="410" y="255" width="250" height="95" rx="12"/>
      <rect x="60" y="255" width="250" height="95" rx="12"/>
    </g>
    <g fill="#0f172a" font-size="20">
      <text x="185" y="118">Application browser</text>
      <text x="535" y="118">Your backend</text>
      <text x="535" y="294">KiteClient</text>
      <text x="185" y="294">User profile</text>
    </g>
    <g fill="#475569" font-size="16">
      <text x="185" y="147">Kite login and redirect</text>
      <text x="535" y="147">Secret stays here</text>
      <text x="535" y="323">One user session</text>
      <text x="185" y="323">Read-only request</text>
      <text x="360" y="100">Request</text>
      <text x="360" y="121">token</text>
      <text x="600" y="216">Access token</text>
      <text x="360" y="283">profile()</text>
    </g>
  </g>
  <g stroke="#2563eb" stroke-width="3" fill="none">
    <path d="M310 150 H395 l-9 -7 m9 7 l-9 7"/>
    <path d="M535 175 V240 l-7 -9 m7 9 l7 -9"/>
    <path d="M410 310 H325 l9 -7 m-9 7 l9 7"/>
  </g>
</svg>
